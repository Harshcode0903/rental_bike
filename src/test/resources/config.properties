# Device / Appium settings - override these with your real device/app values
platformName=Android
automationName=UiAutomator2
deviceName=Android_Emulator
platformVersion=11
udid=                    # optional: device UDID
app=path/to/RoyalBrothers.apk

# OR use package/activity instead of app
appPackage=com.royalbrothers.app    # replace with actual package
appActivity=.MainActivity          # replace with actual activity

# Appium server
appiumServer=http://127.0.0.1:4723/wd/hub

# Timeouts
implicitWait=10
newCommandTimeout=120
